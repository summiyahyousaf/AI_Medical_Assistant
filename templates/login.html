<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Login | AI Medical Assistant
    </title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">


    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>



<div class="login-container">



    <!-- Login Card -->

    <div class="login-card">



        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">

                        {{ message }}

                    </div>


                {% endfor %}

            {% endif %}

        {% endwith %}





        <!-- Logo -->

        <div class="login-logo">

            🩺

        </div>




        <h1>

            Welcome Back

        </h1>




        <p class="login-subtitle">

            Login to your AI Medical Assistant

        </p>






        <!-- Login Form -->


        <form

            action="{{ url_for('login') }}"

            method="POST"

            class="login-form"

        >




            <div class="form-group">


                <label>

                    Email

                </label>



                <input

                    type="email"

                    name="email"

                    placeholder="Enter your email"

                    required

                >



            </div>






            <div class="form-group">


                <label>

                    Password

                </label>



                <input

                    type="password"

                    name="password"

                    placeholder="Enter your password"

                    required

                >



            </div>







            <button

                type="submit"

                class="login-btn"

            >

                Login

            </button>





        </form>







        <!-- Signup -->


        <div class="signup-text">


            Don't have an account?


            <a href="{{ url_for('signup') }}">

                Create Account

            </a>



        </div>






    </div>

</div>



</body>


</html>
